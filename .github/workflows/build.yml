name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # The portable llvm-mingw toolchain that tools/bootstrap.sh fetches, and
    # the tools/*.sh scripts: on a Windows runner, `shell: bash` is Git Bash.
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      # No test opens a sound device, and a runner has none; this makes sure
      # no host started here tries to.
      ADAUDIOLIVE: '0'
    steps:
      - uses: actions/checkout@v7

      # A release tag names the version the programs carry: v<project(VERSION)>,
      # optionally with a -suffix for a pre-release (v1.2.0-rc1). Checked
      # first, so a mistyped tag fails before the build.
      - name: Check the tag against the project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -nE 's/^project\([^ ]+ VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          tag=${GITHUB_REF_NAME#v}
          if [ -z "$version" ] || [ "${tag%%-*}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match project(VERSION ${version:-?}) in CMakeLists.txt"
            exit 1
          fi

      # llvm-mingw, ninja, and the static zlib + phosg that bootstrap.sh
      # builds, keyed on their pins in tools/versions (bump the suffix to
      # start over). The downloaded zips and the build trees of zlib and
      # phosg are left out: bootstrap.sh marks an unpacked toolchain complete
      # and records the revisions it built, so it needs neither again.
      # Restored and saved as two steps, so a run whose tests fail still
      # keeps the bootstrap for the next one.
      - name: Restore third_party
        id: third-party
        uses: actions/cache/restore@v6
        with:
          path: |
            third_party
            !third_party/toolchains/*.zip
            !third_party/win/build-*
          key: third-party-${{ runner.os }}-${{ hashFiles('tools/versions') }}-v1

      - name: Bootstrap (toolchain, zlib, phosg)
        run: bash tools/bootstrap.sh

      - name: Save third_party
        if: steps.third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            third_party
            !third_party/toolchains/*.zip
            !third_party/win/build-*
          key: ${{ steps.third-party.outputs.cache-primary-key }}

      # Into build/win-release, package.sh's build directory, so the package
      # step reuses this build instead of compiling the programs again.
      #
      # -LE gui leaves out the tests that open real windows on the desktop:
      # scr_smoke_* (with the opt-in scr_smoke_e2e-*) and import.gui_flow.
      # The runner has no After Dark, Star Wars Screen Entertainment or Star
      # Trek modules, so the suites that need them skip themselves (exit 77):
      # core.lane_detect_assets, loader_corpus, win16.assets, pe32.assets,
      # pe32.packages, ne16.assets, ne16.pkg, ne16.interaction, ne16.swse,
      # ne16.startrek and import.catalog_real; so do the opt-in ones
      # (core.audio_assets, import.e2e, import.pkg_real, import.download_real,
      # import.covers_real) and cpu_perf (no upstream resource_dasm clone to
      # compare with). The download and cover tests serve their files from a
      # loopback server and need no network.
      - name: Build and test
        run: AD_BUILD_DIR="$PWD/build/win-release" AD_CTEST_ARGS="-LE gui -j4" bash tools/build.sh

      - name: Upload the test log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-log
          path: build/win-release/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

      # build/dist/LongAfterDark: the three programs, README.txt, LICENSE.txt
      # and licenses\.
      - name: Package
        run: bash tools/package.sh

      - uses: actions/upload-artifact@v7
        with:
          name: LongAfterDark-x64
          path: build/dist/LongAfterDark
          if-no-files-found: error

  # The build job's dist, zipped, on a GitHub Release:
  #   a v* tag  the release of that name, "Long After Dark <version>", with
  #             LongAfterDark-<version>-x64.zip and generated notes; a tag
  #             with a -suffix (v1.2.0-rc1) is a pre-release.
  #   main      one pre-release, latest-main, moved to each new commit with
  #             its LongAfterDark-x64.zip replaced: always the newest build,
  #             at the same URL. A pre-release is never marked Latest.
  # Only zips and uploads, so it runs on Linux.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: LongAfterDark-x64
          path: LongAfterDark

      - name: Publish the release
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          about="Unzip it anywhere and keep the three programs together; README.txt inside says what to do next. The programs are not code-signed yet, so Windows SmartScreen may warn before running them."
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
            zip="LongAfterDark-$version-x64.zip"
            zip -qr "$zip" LongAfterDark
            notes=$(printf '%s\n\nSHA-256 of `%s`: `%s`\n' "$about" "$zip" "$(sha256sum "$zip" | cut -d' ' -f1)")
            pre=()
            if [[ "$version" == *-* ]]; then pre=(--prerelease); fi
            # --notes goes before the generated notes.
            gh release create "$GITHUB_REF_NAME" "$zip" --verify-tag "${pre[@]}" \
              --title "Long After Dark $version" --generate-notes --notes "$notes"
          else
            tag=latest-main
            zip=LongAfterDark-x64.zip
            zip -qr "$zip" LongAfterDark
            notes=$(printf 'The newest build of main: commit %s, built %s by %s. It is replaced on every push to main.\n\n%s\n\nSHA-256 of `%s`: `%s`\n' \
              "${GITHUB_SHA:0:7}" "$(date -u '+%Y-%m-%d %H:%M UTC')" "$run_url" "$about" "$zip" "$(sha256sum "$zip" | cut -d' ' -f1)")
            if gh release view "$tag" >/dev/null 2>&1; then
              # Move the tag to this commit, then replace the zip and the notes.
              gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true >/dev/null
              gh release upload "$tag" "$zip" --clobber
              gh release edit "$tag" --prerelease --title "Latest main build" --notes "$notes"
            else
              gh release create "$tag" "$zip" --target "$GITHUB_SHA" --prerelease --latest=false \
                --title "Latest main build" --notes "$notes"
            fi
          fi
